:root{--bg:#07111f;--panel:#102035;--line:#ffffff1b;--text:#edf5ff;--muted:#95a9bf;--blue:#65adff;--mint:#64dfcd;--green:#73d9a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#174b7950,transparent 42%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 24px}.header{position:sticky;top:0;z-index:5;background:#07111eed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.nav{height:70px;display:flex;align-items:center;gap:26px}.brand{font:800 20px Manrope;white-space:nowrap;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,var(--blue),var(--mint));color:#07111f;margin-right:8px}.brand em{font-style:normal;color:#91c3ff}.links{display:flex;gap:20px;margin-left:auto}.links a,.muted{color:var(--muted)}.links a:hover{color:white}.right{display:flex;align-items:center;gap:9px}.btn,.ghost,.danger{border:0;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:700}.btn{color:#06121d;background:linear-gradient(110deg,var(--blue),var(--mint))}.ghost{color:var(--text);background:#ffffff0a;border:1px solid var(--line)}.danger{color:#ff999d;background:#ff777719;border:1px solid #ff777744}.sm{padding:8px 10px;font-size:12px}.count{background:var(--blue);color:#07111f;border-radius:15px;padding:2px 6px;font-size:10px}.hero{padding:68px 0 38px;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.eyebrow{color:#8bc2ff;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}.live,.verified{color:var(--mint)}h1,h2,h3{font-family:Manrope;margin-top:0}.hero h1{font-size:clamp(42px,6vw,67px);line-height:1.04;letter-spacing:-3px;margin:18px 0}.grad{background:linear-gradient(100deg,#fff,#8abaff 65%,var(--mint));background-clip:text;color:transparent}.lead{font-size:16px;line-height:1.75;color:var(--muted);max-width:540px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0}.feature{height:365px;border:1px solid #9bcaff30;border-radius:22px;overflow:hidden;position:relative;background:#12263b;box-shadow:0 18px 55px #0005}.feature img{height:100%;width:100%;object-fit:cover;opacity:.72}.featuretop{position:absolute;top:17px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:10px}.featurecap{position:absolute;bottom:0;left:0;right:0;padding:58px 20px 19px;background:linear-gradient(transparent,#07111ff5)}.featurecap h3{margin:8px 0}.score{display:inline-flex;gap:6px;align-items:center;border:1px solid #73d9a855;background:#73d9a812;color:#8ce5b5;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700}.score b{font-size:14px}.section{padding:38px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px;gap:15px}.sectionhead h2{font-size:27px;margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#12243a,#0a1726);overflow:hidden}.card{transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:#65adff77}.photo{height:175px;position:relative;background:#14263b;cursor:pointer}.photo img{height:100%;width:100%;object-fit:cover}.tag{position:absolute;top:10px;left:10px;background:#07111ee8;padding:5px 8px;border-radius:7px;font-size:10px}.body{padding:13px}.title{font-weight:700;margin:0 0 6px;cursor:pointer;line-height:1.4}.vendor{color:var(--muted);font-size:11px;margin-bottom:11px}.pricerow,.bottomrow{display:flex;justify-content:space-between;align-items:center}.price{font:700 17px Manrope}.rating{font-size:11px;color:#ffcf78}.bottomrow{border-top:1px solid var(--line);padding-top:10px;margin-top:11px}.page{padding:34px 0 68px;min-height:65vh}.pagetitle{font-size:34px;letter-spacing:-1px;margin:7px 0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.field,.select{color:var(--text);background:#091625;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field:focus,.select:focus{border-color:var(--blue)}.filters .field{flex:1;min-width:200px}.select{min-width:140px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:25px}.detailimg{height:410px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.detailimg img{height:100%;width:100%;object-fit:cover}.detailprice{font:800 27px Manrope;margin:18px 0}.desc{color:var(--muted);line-height:1.7}.panel{padding:20px}.columns{display:grid;grid-template-columns:1fr 320px;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.row:last-child{border:0}.qty{display:flex;align-items:center;gap:8px}.qty button{color:white;background:#ffffff09;border:1px solid var(--line);border-radius:6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff{display:grid;gap:6px}.ff label{font-size:12px;color:#b7c7d9}.ff input,.ff select,.ff textarea{width:100%;padding:10px;color:white;background:#091625;border:1px solid var(--line);border-radius:9px}.ff textarea{min-height:75px}.span2{grid-column:span 2}.notice{background:#65adff12;border:1px solid #65adff35;padding:12px;border-radius:10px;color:#b8d9ff;font-size:12px;line-height:1.5}.error{background:#ff777719;border:1px solid #ff777744;color:#ff9b9e;padding:10px;border-radius:9px;margin:10px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:610px;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:500}.status{font-size:10px;color:#a6d0ff;background:#65adff19;padding:5px 8px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#ffffff08;border:1px solid var(--line);border-radius:13px;padding:15px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font:700 23px Manrope;margin-top:5px}.timeline{display:flex;margin:20px 0 2px}.step{flex:1;position:relative;text-align:center;color:#657b91;font-size:10px}.step:before{content:'';position:absolute;left:0;right:0;top:6px;height:2px;background:#293b50}.step:first-child:before{left:50%}.step:last-child:before{right:50%}.step i{position:relative;display:block;width:13px;height:13px;margin:0 auto 7px;border:2px solid #43556b;border-radius:50%;background:#102035}.step.done{color:#8be2b6}.step.done:before{background:#63c99d}.step.done i{background:#63c99d;border-color:#63c99d}.tabs{display:flex;gap:8px;margin:20px 0}.tab{background:#ffffff08;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.tab.active{color:#b7d8ff;border-color:#65adff88}.empty{text-align:center;padding:45px 20px}.assistant{height:350px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}.bubble{max-width:88%;white-space:pre-line;border:1px solid var(--line);background:#ffffff09;padding:11px 13px;border-radius:12px;line-height:1.5}.bubble.user{align-self:flex-end;background:#65adff1a}.bubble.assistant{align-self:flex-start}.chatform{display:flex;gap:8px}.chatform input{flex:1;min-width:0}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.suggestion{border:1px solid var(--line);background:#ffffff08;color:#c4d3e4;border-radius:8px;padding:7px 9px;font-size:10px}.footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:11px}.modalbg{position:fixed;inset:0;background:#000b;z-index:8;display:grid;place-items:center;padding:18px}.modal{background:#0e1c2d;border:1px solid var(--line);border-radius:18px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between}.close{background:none;border:0;color:white;font-size:22px}
@media(max-width:850px){.links{gap:12px}.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.columns{grid-template-columns:1fr 290px}}@media(max-width:620px){.wrap{padding:0 15px}.nav{height:62px;gap:8px}.links{display:none}.right{margin-left:auto}.who{display:none}.hero{padding:42px 0 25px}.feature{height:300px}.grid{gap:10px}.photo{height:140px}.body{padding:10px}.title{font-size:13px}.detail,.columns{grid-template-columns:1fr}.detailimg{height:280px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.section{padding:28px 0}}
</style></head><body>
<header class="header"><div class="wrap nav"><a href="#home" class="brand"><span class="mark">◆</span>Trust<em>Cart</em></a><nav class="links" id="links"></nav><div class="right" id="right"></div></div></header><main id="app"></main><footer class="footer"><div class="wrap">TrustCart · Shopping built on trust. <span style="float:right">Demo data and trust metrics are simulated.</span></div></footer><div id="modal"></div>
<script>
(()=>{'use strict';
const STORE='trustcart-demo-v1',photo=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&q=80`;
const seed={users:[{id:'admin',name:'TrustCart Admin',email:'admin@trustcart.demo',password:'admin123',role:'admin',active:true},{id:'vendor1',name:'Aarav Mehta',email:'vendor@trustcart.demo',password:'vendor123',role:'vendor',store:'Pixel & Pine',active:true,verified:true,completed:284},{id:'customer1',name:'Riya Sharma',email:'customer@trustcart.demo',password:'customer123',role:'customer',active:true}],products:[
{id:'p1',name:'Nimbus Pro Wireless Headphones',category:'Electronics',price:8999,rating:4.8,vendor:'Pixel & Pine',vendorId:'vendor1',trust:96,stock:18,description:'Immersive noise cancellation, 40-hour battery and balanced sound for work and travel.',image:photo('photo-1505740420928-5e560c06d30e')},
{id:'p2',name:'AeroBook 14 Creator Laptop',category:'Electronics',price:64990,rating:4.7,vendor:'Northstar Tech',vendorId:'vendor2',trust:94,stock:9,description:'A light, powerful 14-inch laptop with a vivid display and all-day battery, designed for study and creative work.',image:photo('photo-1496181133206-80ce9b88a853')},
{id:'p3',name:'Everyday Canvas Backpack',category:'Accessories',price:1799,rating:4.6,vendor:'Good Earth Goods',vendorId:'vendor3',trust:92,stock:35,description:'A durable canvas backpack with a padded laptop sleeve and recycled lining.',image:photo('photo-1553062407-98eeb64c6a62')},
{id:'p4',name:'Luma Ceramic Pour-over Set',category:'Home',price:2490,rating:4.9,vendor:'Clay & Co.',vendorId:'vendor4',trust:98,stock:14,description:'Hand-finished stoneware coffee set, made in small batches with a reusable stainless filter.',image:photo('photo-1495474472287-4d71bcdd2085')},
{id:'p5',name:'Orbit Smartwatch S2',category:'Electronics',price:11999,rating:4.5,vendor:'Northstar Tech',vendorId:'vendor2',trust:89,stock:22,description:'A bright AMOLED display, fitness tracking and a week of battery life in an aluminum case.',image:photo('photo-1523275335684-37898b6baf30')},
{id:'p6',name:'Botanical Desk Garden Kit',category:'Home',price:1499,rating:4.8,vendor:'Good Earth Goods',vendorId:'vendor3',trust:95,stock:27,description:'A low-maintenance starter garden with seed varieties, compostable pots and a care guide.',image:photo('photo-1416879595882-3373a0480b5b')},
{id:'p7',name:'Studio Wireless Earbuds',category:'Electronics',price:3299,rating:4.4,vendor:'Pixel & Pine',vendorId:'vendor1',trust:93,stock:31,description:'Pocket-sized everyday earbuds with clear calls, touch controls and compact charging case.',image:photo('photo-1606220945770-b5b6c2c55bf1')},
{id:'p8',name:'Merino Study Beanie',category:'Accessories',price:1690,rating:4.7,vendor:'Clay & Co.',vendorId:'vendor4',trust:97,stock:20,description:'Soft, responsibly sourced merino wool in a versatile rib-knit fit.',image:photo('photo-1576871337622-98d48d1cf531')}],orders:[],cart:{},currentUser:null};
let db;try{db=JSON.parse(localStorage.getItem(STORE))||structuredClone(seed)}catch{db=structuredClone(seed)}
const save=()=>localStorage.setItem(STORE,JSON.stringify(db)),el=s=>document.querySelector(s),app=el('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),me=()=>db.users.find(u=>u.id===db.currentUser),prod=id=>db.products.find(p=>p.id===id);
function nav(){let u=me(),links=[['Home','#home'],['Marketplace','#market'],['AI assistant','#assistant']];if(u?.role==='customer')links.push(['My orders','#orders'],['Profile','#profile']);if(u?.role==='vendor')links.push(['Vendor studio','#vendor']);if(u?.role==='admin')links.push(['Admin','#admin']);el('#links').innerHTML=links.map(([n,h])=>`<a href="${h}">${n}</a>`).join('');el('#right').innerHTML=`<a class="ghost sm" href="#cart">Cart <span class="count">${Object.values(db.cart).reduce((a,b)=>a+b,0)}</span></a>${u?`<span class="who muted" style="font-size:11px">${esc(u.name.split(' ')[0])} · ${u.role}</span><button class="ghost sm" onclick="TC.logout()">Log out</button>`:`<a class="muted" href="#login">Log in</a> <a class="btn sm" href="#register">Get started</a>`}`}
function card(p){return `<article class="card"><div class="photo" onclick="location.hash='product/${p.id}'"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"><span class="tag">${esc(p.category)}</span></div><div class="body"><h3 class="title" onclick="location.hash='product/${p.id}'">${esc(p.name)}</h3><div class="vendor">by ${esc(p.vendor)} <span class="verified">◆ Verified</span></div><div class="pricerow"><b class="price">${money(p.price)}</b><span class="rating">★ ${p.rating}</span></div><div class="bottomrow"><span class="score">Trust <b>${p.trust}</b></span><button class="ghost sm" onclick="TC.add('${p.id}')">Add to cart</button></div></div></article>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="panel empty"><h3>No products found</h3><p class="muted">Try changing your search or filters.</p></div>`;
function home(){let picks=[...db.products].sort((a,b)=>b.trust-a.trust);return `<div class="wrap"><section class="hero"><div><span class="eyebrow">● A marketplace you can feel good about</span><h1>Find your next<br><span class="grad">good choice.</span></h1><p class="lead">Discover thoughtful products from independent vendors, with transparent trust scores that help you shop with confidence.</p><div class="actions"><a class="btn" href="#market">Explore marketplace →</a><a class="ghost" href="#assistant">Ask the shopping assistant</a></div><span class="muted">◆ Security and trust signals are clearly labeled demo data.</span></div><div class="feature"><img src="${esc(picks[0].image)}" alt="Featured product"><div class="featuretop"><span>COMMUNITY FAVORITE</span><span class="live">● TRUST VERIFIED</span></div><div class="featurecap"><span class="verified">◆ HIGH TRUST PICK</span><h3>${esc(picks[0].name)}</h3><div style="display:flex;justify-content:space-between">${money(picks[0].price)} · ★ ${picks[0].rating}<span class="score">Trust <b>${picks[0].trust}</b></span></div></div></div></section><section class="section"><div class="sectionhead"><div><span class="eyebrow">Curated with confidence</span><h2>Trusted picks</h2></div><a class="muted" href="#market">Shop all →</a></div>${grid(picks.slice(0,4))}</section><section class="section"><div class="panel"><span class="eyebrow">Great finds. Clear signals.</span><h2 style="margin:8px 0">Shop confidently, every time.</h2><p class="muted">Scores combine simulated vendor and product information, order history, reviews and verification.</p><a href="#assistant" class="btn">Meet your shopping assistant</a></div></section></div>`}
function market(){return `<div class="wrap page"><span class="eyebrow">Independent finds, transparent signals</span><h1 class="pagetitle">The marketplace</h1><p class="muted">Explore products from vendors with visible, simulated trust scores.</p><div class="filters"><input id="q" class="field" placeholder="Search products or vendors…"><select id="cat" class="select"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="max" class="select"><option value="">Any price</option><option value="2000">Under ₹2,000</option><option value="10000">Under ₹10,000</option><option value="70000">Under ₹70,000</option></select><select id="sort" class="select"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="trust">Highest trust</option><option value="rating">Top rated</option></select></div><div id="results"></div></div>`}
function filter(){let q=el('#q').value.toLowerCase(),cat=el('#cat').value,max=Number(el('#max').value)||Infinity,sort=el('#sort').value,list=db.products.filter(p=>(!q||`${p.name} ${p.vendor} ${p.category} ${p.description}`.toLowerCase().includes(q))&&(!cat||p.category===cat)&&p.price<=max);if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);if(sort==='trust')list.sort((a,b)=>b.trust-a.trust);if(sort==='rating')list.sort((a,b)=>b.rating-a.rating);el('#results').innerHTML=grid(list)}
function detail(id){let p=prod(id);return p?`<div class="wrap page"><a href="#market" class="muted">← Back to marketplace</a><div class="detail"><div class="detailimg"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div><div><span class="eyebrow">${esc(p.category)} · ★ ${p.rating}</span><h1 style="font-size:38px;letter-spacing:-1px;margin:12px 0">${esc(p.name)}</h1><div class="vendor">Sold by ${esc(p.vendor)} <span class="verified">◆ Demo verified vendor</span></div><div class="detailprice">${money(p.price)}</div><span class="score">Trust Score <b>${p.trust}</b></span><p class="desc">${esc(p.description)}</p><div class="panel" style="margin:18px 0"><div class="row"><span class="muted">Vendor reliability</span><b>${Math.min(99,p.trust+1)}%</b></div><div class="row"><span class="muted">Product information</span><b>Complete</b></div><div class="row"><span class="muted">Availability</span><b>${p.stock?'In stock':'Out of stock'}</b></div></div><button class="btn" onclick="TC.add('${p.id}')">Add to cart</button> <a href="#cart" class="ghost" style="display:inline-block">View cart</a></div></div></div>`:`<div class="wrap page"><h2>Product not found</h2><a href="#market">Back to marketplace</a></div>`}
function cartPage(){let entries=Object.entries(db.cart).filter(([id,n])=>n>0&&prod(id)),total=entries.reduce((s,[id,n])=>s+prod(id).price*n,0);return `<div class="wrap page"><span class="eyebrow">Your selections</span><h1 class="pagetitle">Shopping cart</h1>${!entries.length?`<div class="panel empty"><h3>Your cart is waiting</h3><p class="muted">Find something you love in the marketplace.</p><a class="btn" href="#market">Browse products</a></div>`:`<div class="columns"><div class="panel">${entries.map(([id,n])=>{let p=prod(id);return `<div class="row"><img src="${esc(p.image)}" style="width:70px;height:60px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>${esc(p.name)}</b><div class="vendor">${esc(p.vendor)} · ${money(p.price)}</div><div class="qty"><button onclick="TC.qty('${id}',-1)">−</button>${n}<button onclick="TC.qty('${id}',1)">+</button><button class="danger sm" onclick="TC.remove('${id}')">Remove</button></div></div><b>${money(p.price*n)}</b></div>`}).join('')}</div><aside class="panel"><h3>Order summary</h3><div class="row"><span class="muted">Subtotal</span><b>${money(total)}</b></div><div class="row"><span class="muted">Shipping</span><b>Free</b></div><div class="row"><b>Total</b><b>${money(total)}</b></div><button class="btn" style="width:100%;margin-top:12px" onclick="TC.checkout()">Continue to checkout</button><p class="muted" style="font-size:11px">Demo checkout · no real payment.</p></aside></div>`}</div>`}
function auth(mode){return `<div class="wrap page" style="max-width:570px"><div class="panel"><span class="eyebrow">${mode==='login'?'Welcome back':'Join the marketplace'}</span><h1 class="pagetitle">${mode==='login'?'Log in':'Create your account'}</h1><div id="autherror"></div><form id="authform"><div class="formgrid">${mode==='register'?`<div class="ff span2"><label>Full name</label><input name="name" required minlength="2" placeholder="Your name"></div>`:''}<div class="ff span2"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="ff span2"><label>Password</label><input name="password" type="password" required minlength="6" placeholder="At least 6 characters"></div>${mode==='register'?`<div class="ff span2"><label>Account type</label><select name="role"><option value="customer">Customer</option><option value="vendor">Vendor</option></select></div><div class="ff span2" id="storefield" style="display:none"><label>Store name</label><input name="store" placeholder="Your shop name"></div>`:''}</div><button class="btn" style="width:100%;margin-top:15px">${mode==='login'?'Log in':'Create account'}</button></form><p class="muted" style="font-size:12px;margin-top:14px">${mode==='login'?`New here? <a href="#register" style="color:#91c5ff">Create an account</a>`:`Already registered? <a href="#login" style="color:#91c5ff">Log in</a>`}</p>${mode==='login'?`<div class="notice"><b>Demo accounts</b><br>Customer: customer@trustcart.demo / customer123<br>Vendor: vendor@trustcart.demo / vendor123<br>Admin: admin@trustcart.demo / admin123</div>`:''}</div></div>`}
function orderTimeline(o){let idx=['Placed','Confirmed','Processing','Shipped','Delivered'].indexOf(o.status);return `<div class="timeline">${['Placed','Confirmed','Processing','Shipped','Delivered'].map((s,i)=>`<div class="step ${i<=idx?'done':''}"><i></i>${s}</div>`).join('')}</div>`}
function ordersPage(){let list=db.orders.filter(o=>o.customerId===me()?.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="wrap page"><span class="eyebrow">Your purchases</span><h1 class="pagetitle">Order tracking</h1><p class="muted">Updates from checkout through delivery.</p>${list.length?list.map(o=>`<div class="panel" style="margin:13px 0"><div class="row"><div><b>Order ${esc(o.id)}</b><div class="muted" style="font-size:11px;margin-top:5px">${new Date(o.date).toLocaleDateString()} · ${esc(o.items.map(i=>i.name).join(', '))}</div><div class="muted" style="font-size:11px">Vendor: ${esc(o.vendor)}</div></div><div style="text-align:right"><b>${money(o.total)}</b><br><span class="status">${esc(o.status)}</span></div></div>${orderTimeline(o)}</div>`).join(''):`<div class="panel empty"><h3>No orders yet</h3><p class="muted">Your purchases will appear here.</p><a class="btn" href="#market">Explore products</a></div>`}</div>`}
function required(){return `<div class="wrap page"><div class="panel empty"><h2>Please log in to continue</h2><a class="btn" href="#login">Log in</a></div></div>`}
function profile(){let u=me();return u?`<div class="wrap page"><span class="eyebrow">Account settings</span><h1 class="pagetitle">Your profile</h1><div class="panel" style="max-width:600px"><div class="formgrid"><div class="ff"><label>Name</label><input disabled value="${esc(u.name)}"></div><div class="ff"><label>Role</label><input disabled value="${esc(u.role)}"></div><div class="ff span2"><label>Email</label><input disabled value="${esc(u.email)}"></div></div><div class="notice" style="margin-top:14px">Profile data is stored locally in this browser.</div></div></div>`:required()}
function checkoutPage(){if(!me())return required();if(!Object.keys(db.cart).length)return `<div class="wrap page"><div class="panel empty"><h2>Your cart is empty</h2><a class="btn" href="#market">Browse products</a></div></div>`;let total=Object.entries(db.cart).reduce((s,[id,n])=>s+(prod(id)?.price||0)*n,0);return `<div class="wrap page"><span class="eyebrow">Almost yours</span><h1 class="pagetitle">Secure checkout</h1><p class="muted">Simulated payment only — no real transaction will occur.</p><form class="columns" id="checkoutform"><div class="panel"><h3>Customer & shipping information</h3><div class="formgrid"><div class="ff"><label>Full name</label><input name="name" value="${esc(me().name)}" required></div><div class="ff"><label>Email</label><input name="email" type="email" value="${esc(me().email)}" required></div><div class="ff span2"><label>Address</label><input name="address" required placeholder="Street and house number"></div><div class="ff"><label>City</label><input name="city" required></div><div class="ff"><label>PIN code</label><input name="pin" required pattern="[0-9]{6}" maxlength="6" placeholder="6 digits"></div></div><h3 style="margin:22px 0 10px">Simulated payment</h3><div class="notice">No payment details are requested, processed or stored.</div><div class="ff" style="margin-top:12px"><label>Payment method</label><select name="payment"><option>Demo card</option><option>Cash on delivery (demo)</option><option>UPI (demo)</option></select></div></div><aside class="panel"><h3>Order summary</h3>${Object.entries(db.cart).map(([id,n])=>{let p=prod(id);return p?`<div class="row"><span>${esc(p.name)} × ${n}</span><b>${money(p.price*n)}</b></div>`:''}).join('')}<div class="row"><span class="muted">Shipping</span><b>Free</b></div><div class="row"><b>Total</b><b>${money(total)}</b></div><button class="btn" style="width:100%;margin-top:12px">Place demo order · ${money(total)}</button></aside></form></div>`}
function vendorPage(){let u=me();if(!u||u.role!=='vendor')return required();let own=db.products.filter(p=>p.vendorId===u.id),orders=db.orders.filter(o=>o.items.some(i=>i.vendorId===u.id));return `<div class="wrap page"><span class="eyebrow">Vendor studio · ${esc(u.store||u.name)}</span><h1 class="pagetitle">Your dashboard</h1><p class="muted">Manage your catalog and incoming orders.</p><div class="stats"><div class="stat"><small>Products</small><strong>${own.length}</strong></div><div class="stat"><small>Incoming orders</small><strong>${orders.length}</strong></div><div class="stat"><small>Completed orders</small><strong>${u.completed||0}</strong></div><div class="stat"><small>Store trust</small><strong>${u.verified?96:72}</strong></div></div><div class="sectionhead" style="margin-top:28px"><h2>Your products</h2><button class="btn" onclick="TC.productForm()">＋ Add product</button></div>${own.length?`<div class="panel tablewrap"><table class="table"><tr><th>Product</th><th>Price</th><th>Trust</th><th>Stock</th><th>Actions</th></tr>${own.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.trust}</td><td>${p.stock}</td><td><button class="ghost sm" onclick="TC.productForm('${p.id}')">Edit</button> <button class="danger sm" onclick="TC.deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>`:`<div class="panel empty"><p>No products yet.</p><button class="btn" onclick="TC.productForm()">Create a product</button></div>`}<h2 style="margin-top:30px">Incoming orders</h2>${orders.length?orders.map(o=>`<div class="panel" style="margin:12px 0"><div class="row"><div><b>${esc(o.id)}</b><div class="muted" style="font-size:11px">${esc(o.customerName)} · ${esc(o.items.map(i=>i.name+' × '+i.quantity).join(', '))}</div></div><select class="select" onchange="TC.setStatus('${o.id}',this.value)">${['Placed','Confirmed','Processing','Shipped','Delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join(''):`<div class="panel muted">New customer orders will appear here.</div>`}</div>`}
function adminPage(){if(me()?.role!=='admin')return required();return `<div class="wrap page"><span class="eyebrow">Marketplace oversight</span><h1 class="pagetitle">Admin dashboard</h1><div class="stats"><div class="stat"><small>Users</small><strong>${db.users.length}</strong></div><div class="stat"><small>Vendors</small><strong>${db.users.filter(u=>u.role==='vendor').length}</strong></div><div class="stat"><small>Products</small><strong>${db.products.length}</strong></div><div class="stat"><small>Orders</small><strong>${db.orders.length}</strong></div></div><div class="tabs"><button class="tab active" onclick="TC.adminTab('users',this)">Users</button><button class="tab" onclick="TC.adminTab('vendors',this)">Vendors</button><button class="tab" onclick="TC.adminTab('products',this)">Products</button><button class="tab" onclick="TC.adminTab('orders',this)">Orders</button></div><div id="admintable">${adminTable('users')}</div><div class="notice" style="margin-top:14px">Trust and verification metrics are simulated demo data.</div></div>`}
function adminTable(type){let rows=[],heads={users:'<th>Name</th><th>Email</th><th>Role</th>',vendors:'<th>Store</th><th>Email</th><th>Status</th><th>Action</th>',products:'<th>Product</th><th>Vendor</th><th>Price</th><th>Trust</th><th>Action</th>',orders:'<th>Order</th><th>Customer</th><th>Total</th><th>Status</th>'};if(type==='users')rows=db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td></tr>`);if(type==='vendors')rows=db.users.filter(u=>u.role==='vendor').map(u=>`<tr><td>${esc(u.store||u.name)}</td><td>${esc(u.email)}</td><td>${u.active?'Active':'Inactive'}</td><td><button class="${u.active?'danger':'ghost'} sm" onclick="TC.toggleVendor('${u.id}')">${u.active?'Deactivate':'Activate'}</button></td></tr>`);if(type==='products')rows=db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.vendor)}</td><td>${money(p.price)}</td><td>${p.trust}</td><td><button class="danger sm" onclick="TC.adminDelete('${p.id}')">Remove</button></td></tr>`);if(type==='orders')rows=db.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.customerName)}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td></tr>`);return `<div class="panel tablewrap"><table class="table"><tr>${heads[type]}</tr>${rows.length?rows.join(''):`<tr><td colspan="5" class="muted">No records yet.</td></tr>`}</table></div>`}
let chat=[];function assistant(){return `<div class="wrap page"><span class="eyebrow">Local intelligence · no API required</span><h1 class="pagetitle">Your shopping assistant</h1><p class="muted">Tell me what you need. I'll match your request against the marketplace.</p><div class="panel assistant"><div class="messages" id="messages"></div><form class="chatform" id="chatform"><input class="field" name="question" required placeholder="Try ‘highly trusted headphones’…"><button class="btn">Send</button></form></div><div class="suggestions"><button class="suggestion" onclick="TC.ask('I need a laptop under ₹70,000')">Laptop under ₹70,000</button><button class="suggestion" onclick="TC.ask('Show me highly trusted headphones')">Trusted headphones</button><button class="suggestion" onclick="TC.ask('Gift for a student under ₹2,000')">Student gift under ₹2,000</button></div><span class="muted" style="font-size:11px">Recommendations use deterministic local matching. Trust scores are simulated.</span></div>`}
function renderChat(){let box=el('#messages');if(box){box.innerHTML=(chat.length?chat:[{role:'assistant',text:'Hi! Describe a product, budget or trust preference. I can search this marketplace.'}]).map(x=>`<div class="bubble ${x.role}">${esc(x.text)}</div>`).join('');box.scrollTop=box.scrollHeight}}
function ask(text){if(!text)return;chat.push({role:'user',text});let q=text.toLowerCase(),match=q.match(/(?:under|below|less than|within)\s*(?:₹|rs\.?\s*)?([\d,]+)/i),budget=match?Number(match[1].replace(/,/g,'')):Infinity,terms=q.split(/[^a-z0-9]+/).filter(x=>x.length>3&&!['under','highly','trusted','need','show','with','gift','student'].includes(x));let found=db.products.filter(p=>p.price<=budget&&(!terms.length||terms.some(t=>`${p.name} ${p.category} ${p.description} ${p.vendor}`.toLowerCase().includes(t))));if(/high trust|highly trusted|trust score|trusted/i.test(q))found.sort((a,b)=>b.trust-a.trust);else found.sort((a,b)=>b.rating-a.rating);let picks=(found.length?found:[...db.products].sort((a,b)=>b.trust-a.trust)).slice(0,3);chat.push({role:'assistant',text:(found.length?`Here are some matches${budget<Infinity?' under '+money(budget):''}:`:`No exact match${budget<Infinity?' under '+money(budget):''}; here are highly trusted alternatives:`)+'\n'+picks.map(p=>`• ${p.name} — ${money(p.price)}, trust ${p.trust}/100, ★ ${p.rating} (product/${p.id})`).join('\n')+'\nTrust scores are simulated demo signals.'});renderChat()}
function route(){nav();let [path,arg]=(location.hash.slice(1)||'home').split('/');if(path==='home')app.innerHTML=home();else if(path==='market'){app.innerHTML=market();filter();['q','cat','max','sort'].forEach(id=>el('#'+id).addEventListener(id==='q'?'input':'change',filter))}else if(path==='product')app.innerHTML=detail(arg);else if(path==='cart')app.innerHTML=cartPage();else if(path==='login'||path==='register'){app.innerHTML=auth(path);bindAuth(path)}else if(path==='checkout'){app.innerHTML=checkoutPage();bindCheckout()}else if(path==='orders')app.innerHTML=me()?.role==='customer'?ordersPage():required();else if(path==='profile')app.innerHTML=profile();else if(path==='vendor')app.innerHTML=vendorPage();else if(path==='admin')app.innerHTML=adminPage();else if(path==='assistant'){app.innerHTML=assistant();renderChat();el('#chatform').addEventListener('submit',e=>{e.preventDefault();let input=e.currentTarget.question;ask(input.value);input.value=''})}else app.innerHTML=home();window.scrollTo(0,0)}
function bindAuth(mode){let f=el('#authform'),role=f.elements.role;if(role)role.addEventListener('change',()=>el('#storefield').style.display=role.value==='vendor'?'grid':'none');f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f),email=String(d.get('email')).trim().toLowerCase(),password=String(d.get('password'));if(mode==='login'){let u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===password);if(!u){el('#autherror').innerHTML='<div class="error">Email or password is incorrect. Please try again.</div>';return}if(!u.active){el('#autherror').innerHTML='<div class="error">This vendor account is inactive.</div>';return}db.currentUser=u.id;save();location.hash=u.role==='admin'?'admin':u.role==='vendor'?'vendor':'market'}else{if(db.users.some(u=>u.email.toLowerCase()===email)){el('#autherror').innerHTML='<div class="error">An account with this email already exists.</div>';return}let role=d.get('role'),name=String(d.get('name')).trim(),store=String(d.get('store')||'').trim();if(role==='vendor'&&!store){el('#autherror').innerHTML='<div class="error">Please enter a store name.</div>';return}let u={id:'u'+Date.now(),name,email,password,role,active:true};if(role==='vendor')Object.assign(u,{store,verified:false,completed:0});db.users.push(u);db.currentUser=u.id;save();location.hash=role==='vendor'?'vendor':'market'}})}
function bindCheckout(){el('#checkoutform')?.addEventListener('submit',e=>{e.preventDefault();let f=e.currentTarget;if(!f.reportValidity())return;let d=new FormData(f),items=Object.entries(db.cart).map(([id,n])=>{let p=prod(id);return p?{productId:id,name:p.name,vendor:p.vendor,vendorId:p.vendorId,quantity:n,price:p.price}:null}).filter(Boolean),total=items.reduce((s,x)=>s+x.quantity*x.price,0),o={id:'TC-'+Date.now().toString().slice(-8),date:new Date().toISOString(),customerId:me().id,customerName:String(d.get('name')),items,total,status:'Placed',vendor:[...new Set(items.map(i=>i.vendor))].join(', ')};db.orders.push(o);items.forEach(i=>{let p=prod(i.productId);if(p)p.stock=Math.max(0,p.stock-i.quantity)});db.cart={};save();app.innerHTML=`<div class="wrap page"><div class="panel empty"><span class="eyebrow">Order confirmed · demo checkout</span><h1 class="pagetitle">Thanks, ${esc(d.get('name'))}.</h1><p class="muted">Your demo order has been placed. Payment was simulated.</p><div class="panel" style="display:inline-block;text-align:left"><span class="muted">ORDER ID</span><br><b>${esc(o.id)}</b><div class="row">Total <b>${money(total)}</b></div><span class="muted">No real payment was processed.</span></div><p><a class="btn" href="#orders">Track your order</a> <a class="ghost" href="#market">Continue shopping</a></p></div></div>`;nav()})}
function productForm(id){let p=id&&prod(id);el('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)TC.closeModal()"><div class="modal"><div class="modalhead"><h2>${p?'Edit':'Add'} product</h2><button class="close" onclick="TC.closeModal()">×</button></div><div id="prodError"></div><form id="prodform"><div class="formgrid"><div class="ff span2"><label>Product name</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="ff"><label>Category</label><select name="category"><option>Electronics</option><option>Accessories</option><option>Home</option><option>Fashion</option><option>Books</option></select></div><div class="ff"><label>Price (₹)</label><input name="price" type="number" min="1" required value="${p?.price||''}"></div><div class="ff"><label>Stock</label><input name="stock" type="number" min="0" required value="${p?.stock??1}"></div><div class="ff"><label>Image URL</label><input name="image" value="${esc(p?.image||'')}"></div><div class="ff span2"><label>Description</label><textarea name="description" required>${esc(p?.description||'')}</textarea></div></div><button class="btn" style="margin-top:14px">Save product</button></form></div></div>`;let f=el('#prodform');if(p)f.elements.category.value=p.category;f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f),u=me(),name=String(d.get('name')).trim(),description=String(d.get('description')).trim(),price=Number(d.get('price'));if(!name||!description||price<=0){el('#prodError').innerHTML='<div class="error">Enter a product name, description and positive price.</div>';return}let val={name,description,price,category:d.get('category'),stock:Number(d.get('stock')),image:String(d.get('image')).trim()||photo('photo-1542291026-7eec264c27ff')},trust=Math.min(99,70+(description.length>45?10:0)+(u.verified?15:0));if(p)Object.assign(p,val,{trust});else db.products.push({id:'p'+Date.now(),...val,vendor:u.store||u.name,vendorId:u.id,rating:4.5,trust});save();closeModal();route()})}
function closeModal(){el('#modal').innerHTML=''}
const TC={add(id){if(!prod(id))return;db.cart[id]=(db.cart[id]||0)+1;save();nav();let b=document.querySelector(`button[onclick="TC.add('${id}')"]`);if(b){let t=b.textContent;b.textContent='Added ✓';setTimeout(()=>b.textContent=t,800)}},qty(id,d){db.cart[id]=Math.max(0,(db.cart[id]||0)+d);if(!db.cart[id])delete db.cart[id];save();route()},remove(id){delete db.cart[id];save();route()},checkout(){location.hash=me()?'checkout':'login'},logout(){db.currentUser=null;save();location.hash='home'},ask,productForm,closeModal,deleteProduct(id){if(confirm('Delete this product?')){db.products=db.products.filter(p=>p.id!==id);save();route()}},adminDelete(id){db.products=db.products.filter(p=>p.id!==id);save();route()},toggleVendor(id){let u=db.users.find(x=>x.id===id);if(u){u.active=!u.active;save();route()}},setStatus(id,status){let o=db.orders.find(x=>x.id===id);if(o){o.status=status;save();route()}},adminTab(type,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');el('#admintable').innerHTML=adminTable(type)}};window.TC=TC;window.addEventListener('hashchange',route);route();
})();
</script></body></html>
